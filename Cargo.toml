[workspace]
resolver = "2"
members = [
    "crates/tideline-core",
    "crates/tideline-sdk",
    "crates/tideline-host",
    "crates/tideline-host/tests/fixtures/tideline-test-plugin",
    "src-tauri",
]

[workspace.package]
edition = "2021"
rust-version = "1.78"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
futures-util = "0.3"
tideline-core = { path = "crates/tideline-core" }
anyhow = "1"
