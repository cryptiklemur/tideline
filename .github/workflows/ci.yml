name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust (build / test / clippy / fmt)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            liblilv-dev \
            libsuil-dev \
            libpipewire-0.3-dev \
            libxcb1-dev \
            libxcb-icccm4-dev \
            libxcb-keysyms1-dev \
            libxcb-shape0-dev \
            libasound2-dev \
            libjack-jackd2-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-ci

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: build frontend (for tauri::generate_context!)
        run: pnpm build

      - name: build plugin binaries (debug, for include_bytes!)
        run: |
          cargo build \
            -p tideline-tones \
            -p tideline-notifications \
            -p tideline-ptt \
            -p tideline-effects

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build
        run: cargo build --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace

  frontend:
    name: Frontend (svelte-check / vitest / build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: svelte-check
        run: pnpm check

      - name: vitest
        run: pnpm test

      - name: vite build
        run: pnpm build

  tauri-bundle:
    name: Tauri bundle (smoke build)
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            liblilv-dev \
            libsuil-dev \
            libpipewire-0.3-dev \
            libxcb1-dev \
            libxcb-icccm4-dev \
            libxcb-keysyms1-dev \
            libxcb-shape0-dev \
            libasound2-dev \
            libjack-jackd2-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tauri-bundle

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: build plugin binaries (release)
        run: |
          cargo build --release \
            -p tideline-tones \
            -p tideline-notifications \
            -p tideline-ptt \
            -p tideline-effects

      - name: tauri build (binary only, no bundle)
        run: pnpm tauri build --no-bundle

  release:
    name: semantic-release + tauri bundles
    needs: [rust, frontend, tauri-bundle]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      released: ${{ steps.version.outputs.released }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            liblilv-dev \
            libsuil-dev \
            libpipewire-0.3-dev \
            libxcb1-dev \
            libxcb-icccm4-dev \
            libxcb-keysyms1-dev \
            libxcb-shape0-dev \
            libasound2-dev \
            libjack-jackd2-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: pnpm exec semantic-release

      - name: capture version
        id: version
        run: |
          if [ -f .release-version ]; then
            echo "version=$(cat .release-version)" >> "$GITHUB_OUTPUT"
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  arch-package:
    name: Arch package (.pkg.tar.zst)
    needs: [release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
      options: --user root
    permissions:
      contents: write
    steps:
      - name: install build deps + create builder user
        run: |
          pacman -Syu --noconfirm --needed base-devel git github-cli sudo
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers

      - uses: actions/checkout@v4

      - name: stage PKGBUILD
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          mkdir -p /tmp/pkg
          cp packaging/arch/PKGBUILD /tmp/pkg/PKGBUILD
          sed -i "s/__VERSION__/$VERSION/g" /tmp/pkg/PKGBUILD
          chown -R builder:builder /tmp/pkg

      - name: makepkg
        working-directory: /tmp/pkg
        run: sudo -u builder makepkg -s --noconfirm --nocheck

      - name: upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        working-directory: /tmp/pkg
        run: |
          gh release upload "v$VERSION" *.pkg.tar.zst \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
