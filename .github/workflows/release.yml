name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            liblilv-dev \
            libsuil-dev \
            libpipewire-0.3-dev \
            libxcb1-dev \
            libxcb-icccm4-dev \
            libxcb-keysyms1-dev \
            libxcb-shape0-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve tag
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "tag=${REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: 'tideline ${{ steps.tag.outputs.tag }}'
          releaseBody: |
            Heavy WIP release. APIs and config formats are not stable.

            See the commit log for details.
          releaseDraft: false
          prerelease: false
          args: --bundles deb,rpm,appimage
