name: Bug report
description: Something isn't working the way it should
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem. Include exact steps to reproduce if you can.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: |
        - Distro + version
        - PipeWire version (`pipewire --version`)
        - Tideline version / commit
        - Audio interface(s) involved
      value: |
        - Distro:
        - PipeWire:
        - Tideline:
        - Hardware:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: |
        Run with `RUST_LOG=tideline=debug,tideline_effects=debug` and paste the relevant lines.
        Logs live at `~/.local/share/tideline/logs/`.
      render: shell
