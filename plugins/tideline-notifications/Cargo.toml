[package]
name = "tideline-notifications"
version = "1.0.0"
edition = "2021"
description = "Tideline plugin: PTT mode-change desktop notifications"
license = "MIT"

[lib]
name = "tideline_notifications"
path = "src/lib.rs"

[[bin]]
name = "tideline-notifications"
path = "src/main.rs"

[dependencies]
tideline-sdk = { path = "../../crates/tideline-sdk" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
