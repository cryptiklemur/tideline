[package]
name = "tideline-effects"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[[bin]]
name = "tideline-effects"
path = "src/main.rs"

[lib]
name = "tideline_effects"
path = "src/lib.rs"

[dependencies]
tideline-sdk = { path = "../../crates/tideline-sdk" }
tideline-core = { path = "../../crates/tideline-core" }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
thiserror = "1"
base64 = "0.22"
dirs = "5"
once_cell = "1"
which = "6"
tempfile = "3"
jack = "0.13"
livi = "0.7"
lv2_raw = "0.2"
lilv-sys = "0.2"
xcb = "1"
arc-swap = "1"
parking_lot = "0.12"

[build-dependencies]
bindgen = "0.71"
pkg-config = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
