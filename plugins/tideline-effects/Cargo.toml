[package]
name = "tideline-effects"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "tideline-effects"
path = "src/main.rs"

[lib]
name = "tideline_effects"
path = "src/lib.rs"

[dependencies]
tideline-sdk = { path = "../../crates/tideline-sdk" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
rosc = "0.10"
tokio-util = { version = "0.7", features = ["codec", "net"] }
tracing = "0.1"
anyhow = "1"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
