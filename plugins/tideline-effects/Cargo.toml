[package]
name = "tideline-effects"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[[bin]]
name = "tideline-effects"
path = "src/main.rs"

[lib]
name = "tideline_effects"
path = "src/lib.rs"

[dependencies]
tideline-sdk = { path = "../../crates/tideline-sdk" }
carla-sys = { path = "../../crates/carla-sys" }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
thiserror = "1"
base64 = "0.22"
dirs = "5"
once_cell = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
