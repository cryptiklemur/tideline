[package]
name = "tideline-wave-xlr"
version = "0.1.0"
edition = "2021"
description = "Tideline plugin: drives the Elgato Wave XLR mute LED from PTT transmit state."
license = "MIT"

[[bin]]
name = "tideline-wave-xlr"
path = "src/main.rs"

[dependencies]
tideline-sdk = { path = "../../crates/tideline-sdk" }
hidapi = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "sync"] }
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tideline-host = { path = "../../crates/tideline-host" }
tempfile = "3"
